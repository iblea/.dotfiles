model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
web_search = "live"
approvals_reviewer = "auto_review"
model_reasoning_summary = "detailed"
show_raw_agent_reasoning = true
hide_agent_reasoning = false

[sandbox_workspace_write]
network_access = true

[mcp_servers.Context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp", "--api-key", "ctx7sk-4ff59810-3d3a-4358-bd46-d1132e618b71"]

[mcp_servers.sequential-thinking-markdown]
command = "node"
args = ["$HOME/.dotfiles/aiagents/claudecode/sequential-thinking-improved/dist/index.js"]

[mcp_servers.sequential-thinking-markdown.tools.sequentialthinking]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"


# [mcp_servers.playwright]
# command = "npx"
# args = ["-y", "@playwright/mcp@latest"]
# disabled = false

# experimental_use_rmcp_client = true
# [mcp_servers.github]
# url = "https://api.githubcopilot.com/mcp"
# bearer_token = "Bearer api_key"
# # http_headers = { "Authorization" = "Bearer api_key" }
# disabled = false

[notice]
hide_gpt5_1_migration_prompt = true
"hide_gpt-5.1-codex-max_migration_prompt" = true

[notice.model_migrations]
"gpt-5.1-codex-mini" = "gpt-5.2-codex"
"gpt-5.2-codex" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"

[features]
multi_agent = true
memories = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "branch-changes", "context-remaining", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[tui.keymap.editor]
kill_line_end = [ "ctrl-g" ]

[tui.keymap.global]
open_external_editor = [ "ctrl-k" ]

[tui.keymap.list]
move_up = ["up", "ctrl-p", "k"]

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4


[plugins."google-drive@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true
